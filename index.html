<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Blue's SMP</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="overlay-dirt" aria-hidden="true"></div>
  <div class="overlay-vignette" aria-hidden="true"></div>
  <div class="crack-overlay" id="crack-overlay" aria-hidden="true"><canvas id="crack-canvas"></canvas></div>
  <div class="shatter-container" id="shatter-container" aria-hidden="true"></div>
  <div class="secret-reveal" id="secret-reveal">
    <span class="achievement-icon">&#x1F4A5;</span>
    <span class="achievement-title">Achievement Unlocked!</span>
    <span class="achievement-name">Desktop Destroyer</span>
    <span class="achievement-desc">You broke the entire screen.</span>
    <button class="mc-btn restart-btn" onclick="resetBreakingEffect()">Try Again</button>
  </div>
  <main class="screen">
    <header class="logo-block">
      <h1 class="logo-title">Bluer Network</h1>
      <p class="logo-sub">Legacy Console Edition &bull; A network of a lot of things!</p>
    </header>
    <div class="status-bar">
      <div class="status-pill">
        <span class="status-led" id="status-led"></span>
        <span id="status-text">Connecting...</span>
      </div>
      <div class="status-pill">
        <span id="player-count">-</span>
        <span class="status-label">players online</span>
      </div>
    </div>
    <div class="ip-row">
      <span class="ip-label">Server IP</span>
      <span class="ip-addr">bluer-network.ddns.net</span>
      <span class="ip-port">:25565</span>
    </div>
    <nav class="btn-stack">
      <button class="mc-btn" onclick="copyIP(this)">Copy IP Address</button>
      <div class="btn-divider"></div>
      <button class="mc-btn" onclick="openModal('connect')">How to Connect</button>
      <div class="btn-row">
        <button class="mc-btn mc-btn--half" onclick="openModal('about')">About</button>
        <button class="mc-btn mc-btn--half" onclick="openModal('team')">Server Team</button>
      </div>
      <div class="btn-row">
        <button class="mc-btn mc-btn--half" onclick="openModal('info')">Rules &amp; FAQ</button>
      </div>
      <div class="btn-divider"></div>
      <a href="https://discord.gg/x4BuDfpgsE" target="_blank" rel="noopener" class="mc-btn">Join our Discord</a>
      <button class="mc-btn" id="music-btn" onclick="toggleMusic()"><span id="music-label">Play Music</span></button>
      <div class="btn-divider"></div>
      <button class="mc-btn mc-btn--secret" onclick="triggerBreakingEffect()">???</button>
    </nav>
    <footer class="site-footer">
      Not affiliated with Mojang or Microsoft.
    </footer>
  </main>
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-x" onclick="closeModal()" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="mc-btn modal-done" onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>
  <audio id="bgm" loop preload="auto"><source src="assets/oldpage/music.mp3" type="audio/mpeg"></audio>
  <script src="assets/app.js"></script>
</body>
</html>
